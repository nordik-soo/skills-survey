<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f5ef">
<title>Sault Skill Survey</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand" data-go="#/">
      <span class="brand-copy">
        <span class="brand-name">NORDIK Survey</span>
      </span>
    </div>
    <span class="topbar-spacer"></span>
    <div class="lang-picker" id="lang-picker">
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false">Select language</button>
    </div>
  </header>

  <main class="view active" id="view-home">
    <div class="home">
      <section class="hero">
        <div class="hero-copy">
          <h1 id="home-h1">Sault Newcomer Survey 2026</h1>
          <div class="home-body" id="home-body"></div>
          <div class="hero-actions">
            <button class="btn btn-hero" id="start-btn">Start the survey <span aria-hidden="true">→</span></button>
          </div>
        </div>

        <div class="hero-map">
          <img src="assets/northern-ontario-map.png" alt="Illustrated map of Northern Ontario with Sault Ste. Marie marked near the Great Lakes">
          <span class="map-location-label">Sault Ste. Marie</span>
        </div>
      </section>
    </div>
  </main>

  <section class="view" id="view-survey">
    <div class="survey-wrap" id="survey-root"></div>
  </section>

  <section class="view" id="view-admin">
    <div class="admin-wrap" id="admin-root"></div>
  </section>
</div>

<script src="noc-data.js"></script>
<script src="cip-data.js"></script>
<script src="survey-data.js"></script>
<script src="translations.js"></script>
<script src="timing.js"></script>
<script src="app.js"></script>
</body>
</html>
